services:
  - type: web
    name: teampulse
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: ConnectionStrings__TeamPulse
        sync: false
      - key: Authentication__Jwt__SigningKey
        generateValue: true
      - key: Email__Enabled
        value: "false"
      - key: Email__PublicAppUrl
        value: https://teampulse-xgq8.onrender.com
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__SmtpUsername
        sync: false
      - key: Email__SmtpPassword
        sync: false
      - key: Email__SenderAddress
        sync: false
      - key: Integrations__GitHub__Webhook__Enabled
        value: "false"
      - key: Integrations__GitHub__Webhook__Secret
        sync: false
